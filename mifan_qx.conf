# ============================================================
# 米饭 (mifan.61.com) 每日签到 - Quantumult X 全部配置
# ============================================================
#
# 以下所有配置都是可订阅的 Raw URL，直接添加即可。
#
# ==================== 1. 定时任务 ====================
# 每天 9:30 自动签到
#
#   [task_local]
#   0 30 9 * * * https://raw.githubusercontent.com/1009394958/mifan-checkin/main/mifan_checkin.js, tag=米饭签到, enabled=true
#
# ==================== 2. 自动捕获 Token（可选）====================
# 在 Safari 登录米饭账号时自动拦截并保存 Token
#
#   [rewrite_local]
#   ^https://mifan\.61\.com/api/v1/login url script-response-body https://raw.githubusercontent.com/1009394958/mifan-checkin/main/mifan_checkin.js
#
#   [mitm]
#   hostname = mifan.61.com
#
# ==================== 3. BoxJS 面板管理 Token（推荐）==============
# 在 BoxJS 订阅以下链接，用网页管理 Token，无需改脚本：
#
#   https://raw.githubusercontent.com/1009394958/mifan-checkin/main/mifan.boxjs.json
#
# 订阅后在 BoxJS 网页中填入 Token，脚本自动读取。
# 还可以在 BoxJS 中点按钮手动「检查签到状态」或「执行签到」。
#
# ==================== 多账号 ====================
#
#   [task_local]
#   0 30 9 * * * https://raw.githubusercontent.com/1009394958/mifan-checkin/main/mifan_checkin.js, tag=米饭-大号, args=token=第一个token
#   0 31 9 * * * https://raw.githubusercontent.com/1009394958/mifan-checkin/main/mifan_checkin.js, tag=米饭-小号, args=token=第二个token
#
# ==================== 更新日志 ====================
# v1.3 - 新增 BoxJS 面板支持、action 参数（status/sign）
# v1.2 - 新增 MITM 自动捕获 Token
# v1.1 - 初始签到功能
# ============================================================
